; Shared Loot settings - edit this file with Notepad.
; Use 1 for ON, 0 for OFF. Save, then restart Elden Ring to apply changes.

[logging]
; Write diagnostic files to shared-loot/logs. OFF by default.
; Enable this when reporting a bug. This does not enable/disable the mod.
enabled=0

[sharing]
; Share completed shop purchases, including the quantity actually received.
; Only the buyer pays. Each player's own shop stock stays unchanged.
; OFF disables both sending and receiving shop gifts on this PC.
shop_purchases=1

; Share gathering rewards on the supported item allowlist.
; Randomized gathering rewards are not fully supported yet.
gathering_materials=1
